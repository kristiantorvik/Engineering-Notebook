{% extends "base.html" %}

{% block scripts %}
{{ super() }}
<script>
  document.addEventListener("DOMContentLoaded", function () {
    // Open external links in a new tab
    document.querySelectorAll("a[href]").forEach(function (a) {
      var href = a.getAttribute("href");
      if (href && href.startsWith("http") && !href.includes(window.location.hostname)) {
        a.setAttribute("target", "_blank");
        a.setAttribute("rel", "noopener noreferrer");
      }
    });

    // A4 portrait at 96 CSS dpi, minus 1.5cm margins each side and 1em padding
    var NB_PRINT_WIDTH = 640;

    // Hide "## For copy/paste" sections (heading + everything until next H2)
    // when printing. Pure CSS can't span "this heading and the next N siblings",
    // and the markdown source has no wrapper class to target, so do it in JS.
    function nbHidePrintSections() {
      var typeset = document.querySelector('.md-typeset');
      if (!typeset) return;

      typeset.querySelectorAll('h2').forEach(function (h) {
        // mkdocs-material injects an anchor link inside every heading — strip
        // it before comparing text.
        var clone = h.cloneNode(true);
        var anchor = clone.querySelector('.headerlink');
        if (anchor) anchor.remove();
        if (clone.textContent.trim().toLowerCase() !== 'for copy/paste') return;

        // Hide the preceding <hr> (every copy/paste section is preceded by
        // `---` in the markdown — leaving it would look like an orphan rule).
        var prev = h.previousElementSibling;
        if (prev && prev.tagName === 'HR') {
          prev.dataset.nbPrintHidden = '1';
          prev.style.display = 'none';
        }

        // Hide the heading itself, then walk siblings until the next H2.
        h.dataset.nbPrintHidden = '1';
        h.style.display = 'none';
        var sib = h.nextElementSibling;
        while (sib && sib.tagName !== 'H2') {
          sib.dataset.nbPrintHidden = '1';
          sib.style.display = 'none';
          sib = sib.nextElementSibling;
        }
      });
    }

    function nbRestorePrintSections() {
      document.querySelectorAll('[data-nb-print-hidden]').forEach(function (el) {
        el.style.display = '';
        delete el.dataset.nbPrintHidden;
      });
    }

    function nbApplyPrintZoom() {
      var typeset = document.querySelector('.md-typeset');
      if (!typeset) return;
      typeset.style.zoom = '';
      void typeset.offsetWidth; // flush so offsetWidth reads are fresh

      // Measure individual elements — more reliable than scrollWidth on the container
      // because ancestor overflow:hidden can hide table overflow from scrollWidth
      var maxW = 0;
      typeset.querySelectorAll('table, pre, .arithmatex').forEach(function (el) {
        maxW = Math.max(maxW, el.offsetWidth);
      });

      if (maxW > NB_PRINT_WIDTH) {
        typeset.style.zoom = (NB_PRINT_WIDTH / maxW).toFixed(4);
        void typeset.offsetWidth; // flush so zoom takes effect before print frame is captured
      }
    }

    window.addEventListener('beforeprint', function () {
      nbHidePrintSections();   // must run first — zoom measures visible elements
      nbApplyPrintZoom();
    });
    window.addEventListener('afterprint', function () {
      var typeset = document.querySelector('.md-typeset');
      if (typeset) typeset.style.zoom = '';
      nbRestorePrintSections();
    });

    // Floating print button — let beforeprint handle zoom, so measurement is in print-mode layout
    var btn = document.createElement("button");
    btn.id = "nb-print-btn";
    btn.title = "Skriv ut";
    btn.setAttribute("aria-label", "Skriv ut siden");
    btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>';
    btn.addEventListener("click", function () { window.print(); });
    document.body.appendChild(btn);
  });
</script>
{% endblock %}

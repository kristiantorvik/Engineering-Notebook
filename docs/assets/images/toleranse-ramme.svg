<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 225" font-family="Roboto Mono, monospace" font-size="14">
  <!-- Oppbygging av toleranseramma (tolerance indicator) etter ISO 1101:2017, 8.2 -->
  <defs>
    <marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9e9e9e"/>
    </marker>
  </defs>

  <!-- Tilleggsindikasjon over ramma -->
  <text x="150" y="62" fill="#ff8a65" font-size="16">4× ⌀10 H8</text>
  <text x="150" y="36" fill="#ff8a65" font-size="12">tilleggsindikasjon: tal på element, mål, UF, ACS …</text>

  <!-- Tilvisingslinje med pil -->
  <polyline points="150,95 90,95 50,150" fill="none" stroke="#9e9e9e" stroke-width="1.5" marker-end="url(#t)"/>
  <text x="20" y="172" fill="#9e9e9e" font-size="12">til elementet</text>

  <!-- Ramme -->
  <g fill="none" stroke="#9e9e9e" stroke-width="2">
    <rect x="150" y="75" width="330" height="40"/>
    <line x1="200" y1="75" x2="200" y2="115"/>
    <line x1="345" y1="75" x2="345" y2="115"/>
    <line x1="390" y1="75" x2="390" y2="115"/>
    <line x1="435" y1="75" x2="435" y2="115"/>
  </g>

  <!-- Symbol: posisjon -->
  <g fill="none" stroke="#4fc3f7" stroke-width="2">
    <circle cx="175" cy="95" r="8"/>
    <line x1="161" y1="95" x2="189" y2="95"/>
    <line x1="175" y1="81" x2="175" y2="109"/>
  </g>

  <!-- Sone, element og karakteristikk -->
  <text x="212" y="101" fill="#4fc3f7" font-size="18">⌀0,1 CZ</text>
  <circle cx="320" cy="95" r="11" fill="none" stroke="#4fc3f7" stroke-width="1.8"/>
  <text x="314.5" y="100.5" fill="#4fc3f7" font-size="15">M</text>

  <!-- Datum -->
  <g fill="#4fc3f7" font-size="18">
    <text x="362" y="101">A</text>
    <text x="407" y="101">B</text>
    <text x="452" y="101">C</text>
  </g>

  <!-- Forklaringar -->
  <g stroke="#9e9e9e" stroke-width="1" fill="none">
    <polyline points="175,118 175,140"/>
    <polyline points="272,118 272,170"/>
    <polyline points="484,95 500,95"/>
  </g>
  <g fill="#9e9e9e" font-size="12">
    <text x="152" y="155">symbol</text>
    <text x="160" y="186">sone, element og karakteristikk</text>
    <text x="160" y="203" font-size="11">(⌀ + toleranseverdi + modifikatorar)</text>
    <text x="506" y="91">datum: primær,</text>
    <text x="506" y="107">sekundær, tertiær</text>
  </g>
</svg>

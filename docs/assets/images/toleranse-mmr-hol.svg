<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Roboto Mono, monospace" font-size="13">
  <!-- Maksimum materialkrav på eit hol: ⌀10 +0,2/0 med posisjon ⌀0,1 (M).
       MMVC = perfekt sylinder ⌀9,9 i teoretisk eksakt posisjon. Holflata kan ikkje gå innanfor han.
       Skjematisk: skilnadene er sterkt overdrivne (MMVC r=40, hol r=50 / r=65). -->

  <!-- ── Venstre: hol ved MMS ── -->
  <text x="40" y="28" fill="#9e9e9e">Hol ved MMS ⌀10,0</text>
  <!-- materiale rundt holet -->
  <path fill-rule="evenodd" d="M50,50h220v180h-220z M220,140a50,50 0 1,0 -100,0a50,50 0 1,0 100,0z" fill="#9e9e9e" fill-opacity="0.15"/>
  <!-- hol, senter forskyvd 10 til høgre -->
  <circle cx="170" cy="140" r="50" fill="none" stroke="#9e9e9e" stroke-width="2.5"/>
  <!-- MMVC -->
  <circle cx="160" cy="140" r="40" fill="#4fc3f7" fill-opacity="0.12" stroke="#4fc3f7" stroke-width="1.5" stroke-dasharray="6 3"/>
  <!-- teoretisk eksakt posisjon -->
  <g stroke="#4fc3f7" stroke-width="1">
    <line x1="100" y1="140" x2="232" y2="140" stroke-dasharray="10 3 2 3"/>
    <line x1="160" y1="80" x2="160" y2="200" stroke-dasharray="10 3 2 3"/>
  </g>
  <!-- holsenter -->
  <g stroke="#ff8a65" stroke-width="1.5">
    <line x1="170" y1="132" x2="170" y2="148"/>
  </g>
  <circle cx="170" cy="140" r="2.5" fill="#ff8a65"/>
  <text x="50" y="254" fill="#ff8a65">senter 0,05 ut → posisjon ⌀0,1</text>

  <!-- ── Høgre: hol ved LMS ── -->
  <text x="360" y="28" fill="#9e9e9e">Hol ved LMS ⌀10,2</text>
  <path fill-rule="evenodd" d="M370,50h220v180h-220z M560,140a65,65 0 1,0 -130,0a65,65 0 1,0 130,0z" fill="#9e9e9e" fill-opacity="0.15"/>
  <!-- hol, senter forskyvd 25 til høgre -->
  <circle cx="495" cy="140" r="65" fill="none" stroke="#9e9e9e" stroke-width="2.5"/>
  <circle cx="470" cy="140" r="40" fill="#4fc3f7" fill-opacity="0.12" stroke="#4fc3f7" stroke-width="1.5" stroke-dasharray="6 3"/>
  <g stroke="#4fc3f7" stroke-width="1">
    <line x1="410" y1="140" x2="572" y2="140" stroke-dasharray="10 3 2 3"/>
    <line x1="470" y1="70" x2="470" y2="210" stroke-dasharray="10 3 2 3"/>
  </g>
  <g stroke="#ff8a65" stroke-width="1.5">
    <line x1="495" y1="132" x2="495" y2="148"/>
  </g>
  <circle cx="495" cy="140" r="2.5" fill="#ff8a65"/>
  <text x="370" y="254" fill="#ff8a65">senter 0,15 ut → posisjon ⌀0,3</text>

  <text x="50" y="284" fill="#4fc3f7">stipla: MMVC ⌀9,9 i teoretisk eksakt posisjon (= tapp på funksjonslære)</text>
</svg>

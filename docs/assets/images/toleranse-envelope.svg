<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" font-family="Roboto Mono, monospace" font-size="13">
  <!-- Envelope-kravet (ISO 14405-1:2025, kap. 9) for ein aksel. Formavviket er sterkt overdrive. -->
  <defs>
    <marker id="e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9e9e9e"/>
    </marker>
    <marker id="eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4fc3f7"/>
    </marker>
  </defs>

  <!-- Hylster: perfekt sylinder med diameter = MMS -->
  <rect x="110" y="70" width="340" height="100" fill="none" stroke="#4fc3f7" stroke-width="1.5" stroke-dasharray="7 4"/>

  <!-- Krum aksel: fyller hylsteret sjølv om alle topunktsmål er mindre enn MMS -->
  <path d="M110,82 Q280,58 450,82 L450,170 Q280,146 110,170 Z" fill="#9e9e9e" fill-opacity="0.15" stroke="#9e9e9e" stroke-width="2.5"/>

  <!-- Topunktsmål -->
  <line x1="200" y1="76" x2="200" y2="164" stroke="#ff8a65" stroke-width="1.5" marker-start="url(#e)" marker-end="url(#e)"/>
  <line x1="360" y1="76" x2="360" y2="164" stroke="#ff8a65" stroke-width="1.5" marker-start="url(#e)" marker-end="url(#e)"/>
  <text x="208" y="125" fill="#ff8a65">d₁</text>
  <text x="368" y="125" fill="#ff8a65">d₂</text>

  <!-- Hylsterdiameter -->
  <line x1="480" y1="70" x2="480" y2="170" stroke="#4fc3f7" stroke-width="1.5" marker-start="url(#eb)" marker-end="url(#eb)"/>
  <line x1="452" y1="70" x2="488" y2="70" stroke="#4fc3f7" stroke-width="1"/>
  <line x1="452" y1="170" x2="488" y2="170" stroke="#4fc3f7" stroke-width="1"/>
  <text x="490" y="117" fill="#4fc3f7">⌀ MMS</text>
  <text x="490" y="133" fill="#4fc3f7" font-size="11">(GN ≤ MMS)</text>

  <text x="110" y="40" fill="#4fc3f7">hylster: perfekt sylinder med ⌀ = MMS</text>
  <text x="110" y="205" fill="#ff8a65">topunktsmål d₁, d₂ … ≥ LMS</text>
  <text x="110" y="228" fill="#9e9e9e" font-size="11">aksel — formavviket er overdrive</text>
</svg>

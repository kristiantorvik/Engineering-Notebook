<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 240" font-family="Roboto Mono, monospace" font-size="14">
  <!-- Tverrsnitt av kilereim: toppbreidde b0, høgde h, datumbreidde bd, kilevinkel α (ca. 40° på reima). -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9e9e9e"/>
    </marker>
  </defs>

  <!-- Reimprofil -->
  <polygon points="115,70 285,70 248.6,170 151.4,170" fill="#9e9e9e" fill-opacity="0.15" stroke="#9e9e9e" stroke-width="2.5"/>
  <!-- Strekkstreng (cord) -->
  <line x1="126" y1="92" x2="274" y2="92" stroke="#9e9e9e" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- Datumlinje -->
  <line x1="90" y1="95" x2="310" y2="95" stroke="#4fc3f7" stroke-width="1.5" stroke-dasharray="7 4"/>
  <line x1="124.1" y1="110" x2="275.9" y2="110" stroke="#4fc3f7" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="186" y="128" fill="#4fc3f7">b<tspan baseline-shift="sub" font-size="10">d</tspan></text>
  <text x="316" y="99" fill="#4fc3f7" font-size="12">datumlinje</text>

  <!-- Toppbreidde b0 -->
  <line x1="115" y1="40" x2="285" y2="40" stroke="#9e9e9e" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="115" y1="34" x2="115" y2="66" stroke="#9e9e9e" stroke-width="1"/>
  <line x1="285" y1="34" x2="285" y2="66" stroke="#9e9e9e" stroke-width="1"/>
  <text x="188" y="32" fill="#9e9e9e">b<tspan baseline-shift="sub" font-size="10">0</tspan></text>

  <!-- Høgde h -->
  <line x1="60" y1="70" x2="60" y2="170" stroke="#9e9e9e" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="54" y1="70" x2="112" y2="70" stroke="#9e9e9e" stroke-width="1"/>
  <line x1="54" y1="170" x2="148" y2="170" stroke="#9e9e9e" stroke-width="1"/>
  <text x="38" y="125" fill="#9e9e9e">h</text>

  <!-- Kilevinkel α -->
  <line x1="248.6" y1="170" x2="230.4" y2="220" stroke="#ff8a65" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="151.4" y1="170" x2="169.6" y2="220" stroke="#ff8a65" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="192" y="222" fill="#ff8a65">α</text>
</svg>
